<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Planner</title>
  <meta name="description" content="Флайт-планнер для авиасимуляторов: маршрут по реальным точкам, METAR, выбор ВПП и заходов, топливо и загрузка">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233b82f6' d='M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z'/%3E%3C/svg%3E">
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="brand-ico"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
      <span>FLIGHT<b>PLANNER</b></span>
    </div>
    <div class="chips" id="summary"></div>
    <div class="top-actions">
      <button class="btn primary sm" id="savePlanBtn" title="Сохранить план (и скачать .pln для MSFS)">Сохранить</button>
      <div class="dropdown">
        <button class="btn ghost" id="exportBtn">Экспорт ▾</button>
        <div class="dropdown-menu" id="exportMenu">
          <button data-export="copy">Скопировать маршрут</button>
          <button data-export="fpl">План полёта ICAO (.txt)</button>
          <button data-export="fms">X-Plane 11/12 (.fms)</button>
          <button data-export="pln">MSFS 2020/2024 (.pln)</button>
          <button data-export="import">Импорт .pln из MSFS…</button>
          <button data-export="ofp">OFP — брифинг (.txt)</button>
        </div>
      </div>
      <select id="units" class="select-sm" title="Единицы массы">
        <option value="kg">кг</option>
        <option value="lb">lb</option>
      </select>
    </div>
  </header>

  <!-- ЛЕВАЯ ПАНЕЛЬ: построение полёта -->
  <aside class="panel left" id="leftPanel">
    <button class="collapse" data-collapse="leftPanel" title="Свернуть">‹</button>
    <div class="panel-scroll">
      <section class="card">
        <h3>Рейс</h3>
        <div class="grid2">
          <label class="field">
            <span>Вылет (ICAO)</span>
            <input id="dep" class="icao" maxlength="4" placeholder="UUEE" autocomplete="off">
            <div class="ac-list" data-for="dep"></div>
          </label>
          <label class="field">
            <span>Прилёт (ICAO)</span>
            <input id="arr" class="icao" maxlength="4" placeholder="ULLI" autocomplete="off">
            <div class="ac-list" data-for="arr"></div>
          </label>
        </div>
        <div class="apt-names"><div id="depName"></div><div id="arrName"></div></div>
        <div class="grid2">
          <label class="field">
            <span>Запасной</span>
            <input id="altn" class="icao" maxlength="4" placeholder="авто" autocomplete="off">
            <div class="ac-list" data-for="altn"></div>
          </label>
          <label class="field">
            <span>Позывной</span>
            <input id="callsign" maxlength="8" placeholder="AFL123" autocomplete="off">
          </label>
        </div>
        <div class="grid2">
          <label class="field">
            <span>Вылет (UTC)</span>
            <input id="etd" type="time">
          </label>
          <label class="field">
            <span>Правила</span>
            <select id="rules"><option value="I">IFR</option><option value="V">VFR</option></select>
          </label>
        </div>
      </section>

      <section class="card">
        <h3>Воздушное судно</h3>
        <label class="field">
          <span>Тип</span>
          <select id="aircraft"></select>
        </label>
        <div class="ac-spec" id="acSpec"></div>
      </section>

      <section class="card">
        <h3>Маршрут <span class="badge" id="airacBadge"></span></h3>
        <div class="seg" id="levelSeg">
          <button data-level="high" class="on">Верхние трассы</button>
          <button data-level="low">Нижние</button>
        </div>
        <div class="row-btns">
          <button class="btn primary" id="buildRoute">Построить по трассам</button>
          <button class="btn" id="directRoute" title="Прямой маршрут">DCT</button>
        </div>
        <label class="field">
          <span>Строка маршрута (можно редактировать)</span>
          <textarea id="routeText" rows="3" spellcheck="false" placeholder="SID FIX AWY FIX ... STAR"></textarea>
        </label>
        <div class="row-btns">
          <button class="btn" id="applyRoute">Применить строку</button>
        </div>
        <div class="msg" id="routeMsg"></div>
      </section>

      <section class="card">
        <h3>ВПП и процедуры</h3>
        <div class="subhead">Вылет <span id="depWindInfo" class="muted"></span></div>
        <div class="grid2">
          <label class="field"><span>ВПП</span><select id="depRwy"></select></label>
          <label class="field"><span>SID</span><select id="sid"></select></label>
        </div>
        <div class="subhead">Прилёт <span id="arrWindInfo" class="muted"></span></div>
        <div class="grid2">
          <label class="field"><span>ВПП</span><select id="arrRwy"></select></label>
          <label class="field"><span>STAR</span><select id="star"></select></label>
        </div>
        <label class="field"><span>Заход</span><select id="approach"></select></label>
        <div class="msg" id="procMsg"></div>
      </section>

      <section class="card">
        <h3>Мои планы <span class="badge" id="plansCount"></span></h3>
        <div class="row-btns">
          <button class="btn" id="savePlan2">Сохранить текущий</button>
          <button class="btn" id="importPln">Импорт .pln</button>
          <input type="file" id="plnFile" accept=".pln,.xml" hidden>
        </div>
        <div id="plansList"></div>
        <div class="hint">Планы хранятся в этом браузере. Кнопка «.pln» скачивает файл для MSFS 2020/2024: World Map → Load/Save → Load.</div>
      </section>

      <section class="card">
        <h3>Профиль полёта</h3>
        <div class="grid2">
          <label class="field"><span>Эшелон (FL)</span>
            <div class="ovr"><input id="cruiseFl" type="number" step="10" min="10" max="510"><button class="reset" data-reset="cruiseFl" title="Авто">↺</button></div>
          </label>
          <label class="field"><span>Крейсерская скорость</span>
            <div class="ovr"><input id="cruiseSpd" type="text"><button class="reset" data-reset="cruiseSpd" title="Авто">↺</button></div>
          </label>
        </div>
        <div class="grid2">
          <label class="field"><span>Ветер на эшелоне</span>
            <div class="ovr"><input id="windComp" type="number" step="1" placeholder="0"><button class="reset" data-reset="windComp" title="Авто">↺</button></div>
          </label>
          <label class="field"><span>ISA отклонение, °C</span>
            <input id="isaDev" type="number" step="1" value="0">
          </label>
        </div>
        <div class="hint" id="windHint">+ попутный / − встречный, уз</div>
      </section>
    </div>
  </aside>

  <!-- ПРАВАЯ ПАНЕЛЬ: погода, топливо, навлог, чарты -->
  <aside class="panel right" id="rightPanel">
    <button class="collapse" data-collapse="rightPanel" title="Свернуть">›</button>
    <nav class="tabs" id="tabs">
      <button data-tab="wx" class="on">Погода</button>
      <button data-tab="fuel">Топливо</button>
      <button data-tab="log">Навлог</button>
      <button data-tab="charts">Чарты</button>
    </nav>
    <div class="panel-scroll">
      <div class="tab on" id="tab-wx"></div>
      <div class="tab" id="tab-fuel"></div>
      <div class="tab" id="tab-log"></div>
      <div class="tab" id="tab-charts"></div>
    </div>
  </aside>

  <div class="map-ctrl" id="layerCtrl">
    <label><input type="checkbox" data-layer="airports" checked> Аэропорты</label>
    <label><input type="checkbox" data-layer="navaids"> VOR/NDB/точки</label>
    <label><input type="checkbox" data-layer="airways"> Трассы</label>
  </div>

  <div class="modal" id="chartModal" hidden>
    <div class="modal-box">
      <div class="modal-head"><span id="chartTitle"></span><a id="chartOpen" target="_blank" rel="noopener" class="btn ghost">Открыть в новой вкладке</a><button class="btn ghost" id="chartClose">✕</button></div>
      <iframe id="chartFrame" title="Чарт"></iframe>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
